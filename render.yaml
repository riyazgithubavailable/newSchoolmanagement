# Render Blueprint — deploys the whole InstituteOS stack from this repo.
# Render → New → Blueprint → pick this repository.
#
# Values marked `sync: false` are asked for in the Render dashboard (never
# stored in git). Secrets with `generateValue: true` are generated by Render.
# Full guide: docs/07-deployment.md

services:
  # ------------------------------------------------------------------ API
  - type: web
    name: instituteos-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: free # use a paid plan for real schools (free instances sleep when idle)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI # production Atlas connection string
        sync: false
      - key: MONGODB_DB_NAME
        value: school_prod
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY # encrypts 2FA secrets — never change it after going live
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PLATFORM_REFRESH_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN # e.g. https://instituteos-web.onrender.com,https://instituteos-platform.onrender.com
        sync: false
      - key: WEB_APP_URL # school web app address, used in password-reset emails
        sync: false
      - key: PLATFORM_ALLOWED_IPS # optional: your office/home IPs, comma separated
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ----------------------------------------------------------- School web app
  - type: web
    name: instituteos-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL # e.g. https://instituteos-api.onrender.com/api/v1
        sync: false

  # ------------------------------------------------- Platform Admin (owner only)
  - type: web
    name: instituteos-platform
    runtime: static
    rootDir: platform-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
